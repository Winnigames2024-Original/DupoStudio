name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Поставить MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Восстановить пакеты
        run: msbuild DupoApp.sln /t:Restore /p:Configuration=Release

      - name: Собрать
        run: msbuild DupoApp.sln /p:Configuration=Release /m

      - name: Собрать архив
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if (-not $v) { $v = "dev" }
          $dist = "dist/DupoStudio"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item "DupoStudio/bin/Release/net48/*" $dist -Recurse -Force
          Copy-Item "Projects" "$dist/Projects" -Recurse -Force
          Copy-Item "README.md","CHANGELOG.md","LICENSE" $dist -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$dist/*" -DestinationPath "DupoStudio-$v-win-net48.zip" -Force
          Get-ChildItem *.zip | Format-Table Name, Length

      # Описание не передаём: если релиз уже создан вручную, его текст остаётся как был,
      # а экшен только прикладывает архив со сборкой.
      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: DupoStudio-*.zip
