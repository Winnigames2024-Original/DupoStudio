name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Поставить MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Восстановить пакеты
        run: msbuild DupoApp.sln /t:Restore /p:Configuration=Release

      - name: Собрать
        run: msbuild DupoApp.sln /p:Configuration=Release /m

      - name: Проверить, что студия — один файл
        shell: pwsh
        run: |
          $exe = "DupoStudio/bin/Release/net48/DupoStudio.exe"
          if (-not (Test-Path $exe)) { throw "Нет $exe" }
          Copy-Item $exe "DupoStudio.exe"

          $kb = [math]::Round((Get-Item "DupoStudio.exe").Length / 1KB)
          Write-Host "DupoStudio.exe — $kb КБ"

          # Внутри лежат DupoLang.dll и DupoHost.exe, так что меньше 200 КБ быть не может:
          # если меньше — ресурсы не вшились, и на чужой машине exe не запустится.
          if ($kb -lt 200) { throw "Рантайм не попал внутрь exe (всего $kb КБ)" }

      # Описание не передаём: текст релиза, написанный вручную, остаётся как был —
      # прикладывается только сам exe. Исходники GitHub добавляет сам.
      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: DupoStudio.exe
