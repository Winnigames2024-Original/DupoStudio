name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Поставить MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Восстановить пакеты
        run: msbuild DupoApp.sln /t:Restore /p:Configuration=Release

      - name: Собрать
        run: msbuild DupoApp.sln /p:Configuration=Release /m

      - name: Проверить, что студия — один файл
        shell: pwsh
        run: |
          $exe = "DupoStudio/bin/Release/net48/DupoStudio.exe"
          if (-not (Test-Path $exe)) { throw "Нет $exe" }
          Copy-Item $exe "DupoStudio.exe"

          $kb = [math]::Round((Get-Item "DupoStudio.exe").Length / 1KB)
          Write-Host "DupoStudio.exe — $kb КБ"

          $bytes = [System.IO.File]::ReadAllBytes("DupoStudio.exe")
          $text  = [System.Text.Encoding]::UTF8.GetString($bytes)

          foreach ($res in @("DupoStudio.Embedded.DupoLang.dll", "DupoStudio.Embedded.DupoHost.exe")) {
            if ($text.Contains($res)) { Write-Host "внутри: $res" }
            else { throw "Ресурс $res не попал внутрь exe" }
          }

          if ($kb -lt 250) { throw "Подозрительно мало — всего $kb КБ" }

      - name: Собрать установщик
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $version) { $version = "0.0.1" }

          New-Item -ItemType Directory -Force "payload" | Out-Null
          Copy-Item "DupoStudio.exe" "payload/DupoStudio.exe"
          Copy-Item "Projects" "payload/Projects" -Recurse -Force
          Copy-Item "README.md","CHANGELOG.md","LICENSE" "payload" -Force -ErrorAction SilentlyContinue

          $setup = "DupoSetup/bin/Release/net48/DupoSetup.exe"
          if (-not (Test-Path $setup)) { throw "Нет $setup" }

          # DupoSetup — оконное приложение, поэтому ждём завершения явно.
          # Аргументы передаём одной строкой с кавычками: в значениях есть пробелы,
          # а массив PowerShell экранирует их ненадёжно. Имя $args занято самим
          # PowerShell, поэтому переменная называется иначе.
          $out = Join-Path $PWD "DupoStudioSetup.exe"
          $packArgs = '/pack "payload" "{0}" "name=Dupo Studio" "version={1}" ' +
                      '"publisher=Winnigames2024" "folder=DupoStudio" "exe=DupoStudio.exe" ' +
                      '"shortcut=Dupo Studio" "desktop=1" "assoc=.dupolang,.dapp"'
          $packArgs = $packArgs -f $out, $version
          Write-Host "DupoSetup $packArgs"

          $proc = Start-Process -FilePath $setup -ArgumentList $packArgs -NoNewWindow -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Сборка установщика вернула $($proc.ExitCode)" }

          if (-not (Test-Path "DupoStudioSetup.exe")) { throw "Установщик не собрался" }

          # Начинка сжимается, поэтому про абсолютный размер гадать бессмысленно:
          # сравниваем с пустым установщиком — разница и есть приложенный архив.
          $baseKb = [math]::Round((Get-Item $setup).Length / 1KB)
          $madeKb = [math]::Round((Get-Item "DupoStudioSetup.exe").Length / 1KB)
          Write-Host "DupoSetup.exe — $baseKb КБ, с начинкой — $madeKb КБ"

          if ($madeKb -le $baseKb + 50) { throw "Начинка не приложилась: было $baseKb КБ, стало $madeKb КБ" }

      - name: Собрать утилиты командной строки
        shell: pwsh
        run: |
          # DupoBuild ищет рантайм рядом с собой, поэтому кладём их вместе.
          New-Item -ItemType Directory -Force "tools" | Out-Null
          Copy-Item "DupoBuild/bin/Release/net48/DupoBuild.exe" "tools/DupoBuild.exe"
          Copy-Item "DupoCs/bin/Release/net48/DupoLang.exe"     "tools/DupoLang.exe"
          Copy-Item "DupoHost/bin/Release/net48/DupoHost.exe"   "tools/DupoHost.exe"
          Copy-Item "DupoRun/bin/Release/net48/DupoRun.exe"     "tools/DupoRun.exe"
          Copy-Item "DupoLang/bin/Release/net48/DupoLang.dll"   "tools/DupoLang.dll"

          # Проверяем, что утилиты вообще работают.
          & "tools/DupoLang.exe" --check "Projects/HelloWeb/main.dupolang"
          if ($LASTEXITCODE -ne 0) { throw "DupoLang.exe не проверил пример" }

          & "tools/DupoLang.exe" "Projects/HelloWeb/main.dupolang" "tools/sample.cs" "namespace=Sample"
          if (-not (Test-Path "tools/sample.cs")) { throw "DupoLang.exe не выдал C#" }
          Write-Host "--- начало сгенерированного C# ---"
          Get-Content "tools/sample.cs" -TotalCount 20
          Remove-Item "tools/sample.cs"

          & "tools/DupoBuild.exe" "Projects/HelloWeb" "tools/HelloWeb.exe" "name=HelloWeb"
          if ($LASTEXITCODE -ne 0) { throw "DupoBuild.exe вернул $LASTEXITCODE" }
          if (-not (Test-Path "tools/HelloWeb.exe")) { throw "DupoBuild.exe не собрал exe" }
          Remove-Item "tools/HelloWeb.exe"

          Compress-Archive -Path "tools/*" -DestinationPath "DupoTools.zip" -Force
          Write-Host "DupoTools.zip собран"

      # Описание не передаём: текст релиза, написанный вручную, остаётся как был.
      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DupoStudioSetup.exe
            DupoStudio.exe
            DupoTools.zip
