name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Поставить MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Восстановить пакеты
        run: msbuild DupoApp.sln /t:Restore /p:Configuration=Release

      - name: Собрать
        run: msbuild DupoApp.sln /p:Configuration=Release /m

      - name: Проверить, что студия — один файл
        shell: pwsh
        run: |
          $exe = "DupoStudio/bin/Release/net48/DupoStudio.exe"
          if (-not (Test-Path $exe)) { throw "Нет $exe" }

          $kb = [math]::Round((Get-Item $exe).Length / 1KB)
          Write-Host "DupoStudio.exe — $kb КБ"

          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $text  = [System.Text.Encoding]::UTF8.GetString($bytes)

          foreach ($res in @("DupoStudio.Embedded.DupoLang.dll", "DupoStudio.Embedded.DupoHost.exe")) {
            if ($text.Contains($res)) { Write-Host "внутри: $res" }
            else { throw "Ресурс $res не попал внутрь exe" }
          }

          if ($kb -lt 250) { throw "Подозрительно мало — всего $kb КБ" }

      - name: Выложить сборку
        uses: actions/upload-artifact@v4
        with:
          name: DupoStudio-build
          path: DupoStudio/bin/Release/net48/
