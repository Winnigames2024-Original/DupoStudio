name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Поставить MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Восстановить пакеты
        run: msbuild DupoApp.sln /t:Restore /p:Configuration=Release

      - name: Собрать
        run: msbuild DupoApp.sln /p:Configuration=Release /m

      - name: Проверить, что студия — один файл
        shell: pwsh
        run: |
          $exe = "DupoStudio/bin/Release/net48/DupoStudio.exe"
          if (-not (Test-Path $exe)) { throw "Нет $exe" }

          $kb = [math]::Round((Get-Item $exe).Length / 1KB)
          Write-Host "DupoStudio.exe — $kb КБ"

          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $text  = [System.Text.Encoding]::UTF8.GetString($bytes)

          foreach ($res in @("DupoStudio.Embedded.DupoLang.dll", "DupoStudio.Embedded.DupoHost.exe")) {
            if ($text.Contains($res)) { Write-Host "внутри: $res" }
            else { throw "Ресурс $res не попал внутрь exe" }
          }

          if ($kb -lt 250) { throw "Подозрительно мало — всего $kb КБ" }

      - name: Проверить фоновый сервис студии
        shell: pwsh
        run: |
          $exe = "DupoStudio/bin/Release/net48/DupoStudio.exe"
          $p = Start-Process $exe -ArgumentList "--agent","--once" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Агент вернул $($p.ExitCode)" }

          $log = Join-Path $env:LOCALAPPDATA "DupoStudio\agent\agent.log"
          if (-not (Test-Path $log)) { throw "Агент не завёл журнал" }
          Get-Content $log

      - name: Проверить утилиты командной строки
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "tools" | Out-Null
          Copy-Item "DupoBuild/bin/Release/net48/DupoBuild.exe" "tools/DupoBuild.exe"
          Copy-Item "DupoCs/bin/Release/net48/DupoLang.exe"     "tools/DupoLang.exe"
          Copy-Item "DupoHost/bin/Release/net48/DupoHost.exe"   "tools/DupoHost.exe"
          Copy-Item "DupoLang/bin/Release/net48/DupoLang.dll"  "tools/DupoLang.dll" -ErrorAction SilentlyContinue

          & "tools/DupoLang.exe" --check "Projects/HelloWeb/main.dupolang"
          if ($LASTEXITCODE -ne 0) { throw "DupoLang.exe не проверил пример" }

          & "tools/DupoLang.exe" "Projects/FilesDemo/main.dupolang" "tools/demo.cs"
          if (-not (Test-Path "tools/demo.cs")) { throw "DupoLang.exe не выдал C#" }
          Get-Content "tools/demo.cs" -TotalCount 25

          & "tools/DupoBuild.exe" "Projects/HelloWeb" "tools/HelloWeb.exe" "name=HelloWeb"
          if ($LASTEXITCODE -ne 0) { throw "DupoBuild.exe вернул $LASTEXITCODE" }

          & "tools/DupoLang.exe" --check "Projects/ResourcesDemo/main.dupolang"
          if ($LASTEXITCODE -ne 0) { throw "ResourcesDemo не разобрался" }

          & "tools/DupoLang.exe" --check "Projects/ServiceDemo/main.dupolang"
          if ($LASTEXITCODE -ne 0) { throw "ServiceDemo не разобрался" }

          & "tools/DupoLang.exe" --check "Projects/FormsDemo/program.dupolang"
          if ($LASTEXITCODE -ne 0) { throw "FormsDemo не разобрался" }

          & "tools/DupoLang.exe" --check "Projects/HostsDemo/main.dupolang"
          if ($LASTEXITCODE -ne 0) { throw "HostsDemo не разобрался" }

          & "tools/DupoHost.exe" "Projects/DataDemo/main.dupolang"
          if ($LASTEXITCODE -ne 0) { throw "DataDemo не выполнился" }

          & "tools/DupoHost.exe" "Projects/BridgeDemo/main.dupolang"
          if ($LASTEXITCODE -ne 0) { throw "BridgeDemo не выполнился" }
          if (-not (Test-Path "Projects/BridgeDemo/build/BridgeDemo.exe")) { throw "Связка C# и DupoLang не собралась" }

          & "tools/DupoHost.exe" "Projects/CsDemo/main.dupolang"
          if ($LASTEXITCODE -ne 0) { throw "CsDemo не собрался" }
          if (-not (Test-Path "Projects/CsDemo/build/CsDemo.exe")) { throw "Dupo.CSharp не выдал exe" }

          & "tools/DupoBuild.exe" --info "tools/HelloWeb.exe"
          if ($LASTEXITCODE -ne 0) { throw "DupoBuild.exe --info вернул $LASTEXITCODE" }

      - name: Выложить сборку
        uses: actions/upload-artifact@v4
        with:
          name: DupoStudio-build
          path: DupoStudio/bin/Release/net48/
