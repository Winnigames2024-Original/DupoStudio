<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — страница не найдена</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    font: 15px/1.6 'Segoe UI', system-ui, sans-serif;
    color: #e6eaf2; background: #0f1218;
    background-image: radial-gradient(900px 600px at 15% -10%, rgba(59,130,246,.18), transparent 70%);
  }

  .box {
    width: 100%; max-width: 520px;
    background: #161a23; border: 1px solid #262c3a;
    border-radius: 14px; padding: 38px 36px;
  }

  .code {
    font: 600 76px/1 'Segoe UI', sans-serif; letter-spacing: -2px; margin: 0;
    background: linear-gradient(135deg, #3b82f6, #22c7a9);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  h1 { font: 600 20px/1.3 'Segoe UI', sans-serif; margin: 12px 0 0; }
  p  { color: #8d97aa; margin: 14px 0 0; }

  a.home {
    display: inline-block; margin-top: 26px; padding: 10px 18px;
    border-radius: 8px; background: #3b82f6; color: #fff;
    text-decoration: none; font-weight: 600;
  }
  a.home:hover { background: #2f6fd8; }

  .foot {
    margin-top: 28px; padding-top: 18px; border-top: 1px solid #262c3a;
    color: #5a6478; font-size: 12.5px;
  }
  .foot code { color: #8d97aa; }
</style>
</head>
<body>

<div class="box">
  <p class="code">404</p>
  <h1>Такой страницы здесь нет</h1>
  <p>Ссылка устарела или в адресе опечатка. Сам сайт работает.</p>

  <a class="home" href="/">На главную</a>

  <div class="foot">
    Это <code>www/404.html</code> — Web.Server отдаёт его вместо встроенной
    страницы, с кодом 404. Правьте как обычную страницу.
  </div>
</div>

</body>
</html>
